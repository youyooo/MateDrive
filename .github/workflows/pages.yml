name: Deploy support pages

on:
  push:
    branches: [main]
    paths:
      - "docs/support/**"
      - "scripts/generate_review_demo_api.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate privacy-safe App Review demo API
        run: python3 scripts/generate_review_demo_api.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/support
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
