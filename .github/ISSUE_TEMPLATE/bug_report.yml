name: Bug report
description: Report a reproducible MateDrive problem without private vehicle data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API credentials, VINs, precise locations, or private server URLs.
  - type: input
    id: version
    attributes:
      label: MateDrive version or commit
      placeholder: 1.0 (1) or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and system
      placeholder: iPhone model, iOS version, TeslaMate API version
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - Simplified Chinese
        - Traditional Chinese
        - English
        - German
        - Spanish
        - Italian
        - Catalan
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use redacted sample values where data is needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, VINs, precise locations, private URLs, and other personal data.
          required: true
